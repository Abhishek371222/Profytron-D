# Staging-only Web deploy. Does NOT revise production service `web`.
# Usage:
#   gcloud builds submit --config=cloudbuild-web-staging.yaml \
#     --project=gen-lang-client-0497144011 \
#     --substitutions=COMMIT_SHA=...,_BACKEND_API_ORIGIN=https://api-staging-....run.app
steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-f"
      - "apps/web/Dockerfile"
      - "--build-arg"
      - "NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}"
      - "--build-arg"
      - "NEXT_PUBLIC_FRONTEND_URL=${_NEXT_PUBLIC_FRONTEND_URL}"
      - "--build-arg"
      - "NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}"
      - "--build-arg"
      - "NEXT_PUBLIC_BACKEND_URL=${_BACKEND_API_ORIGIN}"
      - "--build-arg"
      - "NEXT_PUBLIC_WS_URL=${_BACKEND_API_ORIGIN}"
      - "--build-arg"
      - "NEXT_PUBLIC_ENABLE_MOCK_API=false"
      - "--build-arg"
      - "NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}"
      - "--build-arg"
      - "NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}"
      - "--build-arg"
      - "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}"
      - "--build-arg"
      - "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}"
      - "--build-arg"
      - "NEXT_PUBLIC_RAZORPAY_KEY_ID=${_NEXT_PUBLIC_RAZORPAY_KEY_ID}"
      - "--build-arg"
      - "BACKEND_API_ORIGIN=${_BACKEND_API_ORIGIN}"
      - "--build-arg"
      - "COMMIT_SHA=$COMMIT_SHA"
      - "--build-arg"
      - "GIT_SHA=$COMMIT_SHA"
      - "--build-arg"
      - "CACHEBUST=$COMMIT_SHA"
      - "-t"
      - "asia-south1-docker.pkg.dev/gen-lang-client-0497144011/profytron/web:staging-$COMMIT_SHA"
      - "."
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "asia-south1-docker.pkg.dev/gen-lang-client-0497144011/profytron/web:staging-$COMMIT_SHA"
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "web-staging"
      - "--image=asia-south1-docker.pkg.dev/gen-lang-client-0497144011/profytron/web:staging-$COMMIT_SHA"
      - "--region=asia-south1"
      - "--platform=managed"
      - "--memory=1Gi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=3"
      - "--allow-unauthenticated"
      - "--set-env-vars=BACKEND_API_ORIGIN=${_BACKEND_API_ORIGIN},NEXT_PUBLIC_BACKEND_URL=${_BACKEND_API_ORIGIN},NEXT_PUBLIC_WS_URL=${_BACKEND_API_ORIGIN},PROFYTRON_ENV=staging"
      - "--set-secrets=DATABASE_URL=DATABASE_URL:latest,AES_MASTER_KEY=AES_MASTER_KEY:latest,METAAPI_TOKEN=METAAPI_TOKEN:latest,OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest,OPENROUTER_MODEL=OPENROUTER_MODEL:latest,NEXT_PUBLIC_SUPABASE_URL=SUPABASE_URL:latest,NEXT_PUBLIC_SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=SUPABASE_ANON_KEY:latest,NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=STRIPE_PUBLISHABLE_KEY:latest,NEXT_PUBLIC_RAZORPAY_KEY_ID=RAZORPAY_KEY_ID:latest,NEXT_PUBLIC_SENTRY_DSN=SENTRY_DSN:latest"
      - "--project=gen-lang-client-0497144011"
images:
  - "asia-south1-docker.pkg.dev/gen-lang-client-0497144011/profytron/web:staging-$COMMIT_SHA"
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
timeout: "1800s"
